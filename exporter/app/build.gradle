plugins {
    alias(libs.plugins.android.application)
}
android {
    namespace 'in.aevora.exporter'
    compileSdk 36
    defaultConfig {
        applicationId "in.aevora.exporter"
        minSdk 24
        targetSdk 36
        // Exporter version ALWAYS matches the Kiwi template version in
        // its assets (2026-10-26 rule): template is Launcher 9.0 / 90,
        // so the exporter is v9 / 9.0 / 90. When the template pin moves,
        // bump these together with it. This is NOT the exported mod
        // version — that is <mod>_kiwi9, set by the patchers.
        versionCode 90
        versionName "9.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    // No androidx dependency on purpose: the sandbox Gradle cache does
    // not have a complete androidx.core transitive set, and the exporter
    // only needs a file provider, which ExportFileProvider implements
    // with the framework ContentProvider API. apksig has no transitive deps.
    implementation "com.android.tools.build:apksig:9.3.1"
}
